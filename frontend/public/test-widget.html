<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TargetChat Beta Test Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f3f4f6;
            color: #1f2937;
            text-align: center;
        }
    </style>
</head>

<body>
    <div
        style="max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h1>TargetChat Beta Test</h1>
        <p>Testing Widget: <strong id="widget-id-display">Loading...</strong></p>
        <p>If the widget does not appear, check the console.</p>
    </div>

    <script>
        (function () {
            // Get widget ID from URL query param "?id=..." or default to 'test-widget'
            const urlParams = new URLSearchParams(window.location.search);
            const widgetId = urlParams.get('id') || 'test-widget';

            document.getElementById('widget-id-display').textContent = widgetId;

            // Reset session if requested
            if (urlParams.get('reset')) {
                console.log('Resetting widget session...');
                // Clear only widget specific keys
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('tc_session_') || key.startsWith('tc_lead_')) {
                        localStorage.removeItem(key);
                    }
                });
            }

            // Load Widget Script
            var script = document.createElement('script');
            script.src = '/widget.js'; // Relative path since we are serving from same origin
            script.async = true;
            script.onload = function () {
                if (window.TargetChatWidget) {
                    console.log('Initializing widget:', widgetId);
                    window.TargetChatWidget.init({
                        widget: widgetId
                    });
                } else {
                    console.error('TargetChatWidget not found');
                }
            };
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>
