version: '3.8'

services:
  database:
    image: mariadb:10.6
    restart: always
    environment:
      # SECURITY: never ship default DB passwords — set these in the shell or
      # a compose-adjacent .env file before `docker compose up`.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
      MARIADB_DATABASE: targetchat
      MARIADB_USER: targetuser
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
    volumes:
      - tc_db_data:/var/lib/mysql
    networks:
      - targetchat_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_USER=targetuser
      - DB_PASS=${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
      - DB_NAME=targetchat
      # SECURITY: the backend refuses to start without strong secrets.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - FILE_SIGN_SECRET=${FILE_SIGN_SECRET:?FILE_SIGN_SECRET must be set}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
    depends_on:
      - database
    ports:
      - "3001:3001"
    networks:
      - targetchat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://your-vps-ip:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - targetchat_network

networks:
  targetchat_network:
    driver: bridge

volumes:
  tc_db_data:
